name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx knip

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config --global user.name "bobbit-ci"
          git config --global user.email "bobbit-ci@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pw-version
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw-version.outputs.v }}
      - run: npx playwright install --with-deps chromium
      # test:unit runs node:test (no built-in retry) followed by Playwright
      # component tests. The node:test tier has a known flake floor (e.g. the
      # worktree-pool git-worktree-move vs background-reset race in
      # tests/worktree-pool.test.ts), tracked for a proper fix. Retry the suite
      # up to 3x so a transient flake doesn't red the build; the Playwright tier
      # additionally self-heals via retries:2 under CI (tests/playwright.config.ts).
      - name: Unit tests (retry to absorb node:test flake floor)
        run: |
          for attempt in 1 2 3; do
            echo "::group::test:unit attempt $attempt"
            if npm run test:unit; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "::warning::test:unit attempt $attempt failed; retrying"
          done
          exit 1
